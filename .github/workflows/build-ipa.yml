# 在 GitHub 免费 macOS runner 上把 FusionRecorder iPhone 端编成**未签名** .ipa
#
# 这是本独立仓库自己的 workflow，只属于融合录屏 iPhone 端：
#   - 不引用、不触发、不写入任何其他应用仓库
#   - 产物分支 ios-build 也是本仓库独有
#
# 取产物（匿名、零依赖）：
#   https://raw.githubusercontent.com/<owner>/FusionRecorder-iOS/ios-build/ci-logs/last-build.md
#   https://raw.githubusercontent.com/<owner>/FusionRecorder-iOS/ios-build/ci-logs/FusionRecorder-<版本>-unsigned.ipa

name: Build FusionRecorder unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write        # 把构建日志与 .ipa 推到 ios-build 分支

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: 读取版本号（唯一来源 project.yml）
        run: |
          VER=$(sed -n 's/^ *MARKETING_VERSION: *"\([^"]*\)".*/\1/p' project.yml | head -1)
          if [ -z "$VER" ]; then
            echo "!! project.yml 里没找到 MARKETING_VERSION"
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "本次构建版本: $VER"

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          ls -d FusionRecorder.xcodeproj
          xcodebuild -project FusionRecorder.xcodeproj -list

      - name: 编译（不签名）
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project FusionRecorder.xcodeproj \
            -scheme FusionRecorder \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | tail -200

      - name: 校验 .app 产物
        if: steps.build.outcome == 'success'
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name 'FusionRecorder.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "!! 没找到 FusionRecorder.app"
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 || true
            exit 1
          fi
          echo "APP=$APP"
          ls -l "$APP"
          echo "--- Info.plist 关键键 ---"
          for k in CFBundleIdentifier CFBundleName CFBundleShortVersionString; do
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>&1 | sed "s/^/$k = /"
          done
          if [ -f "$APP/Assets.car" ]; then
            echo "OK  Assets.car  $(stat -f%z "$APP/Assets.car") 字节"
          else
            echo "!! 缺少 Assets.car（图标资源未编入，IPA 仍可打包）"
          fi

      - name: 打包成 .ipa
        if: steps.build.outcome == 'success'
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name 'FusionRecorder.app' -type d | head -1)
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "FusionRecorder-$VER-unsigned.ipa" Payload
          ls -lh "FusionRecorder-$VER-unsigned.ipa"

      - name: 上传产物（保留 30 天）
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FusionRecorder-${{ env.VER }}-unsigned-ipa
          path: ${{ runner.temp }}/FusionRecorder-${{ env.VER }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 生成 SideStore 源（raw 备选，不开 Pages 也能加源）
        if: steps.build.outcome == 'success'
        run: |
          set -e
          mkdir -p ci-logs
          cp "$RUNNER_TEMP/FusionRecorder-$VER-unsigned.ipa" "ci-logs/FusionRecorder-$VER-unsigned.ipa"
          cp FusionRecorder/Assets.xcassets/AppIcon.appiconset/icon-1024.png ci-logs/icon.png
          IPA_SIZE=$(stat -f%z "ci-logs/FusionRecorder-$VER-unsigned.ipa")
          RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/ios-build/ci-logs"
          IPA_SIZE="$IPA_SIZE" bash scripts/gen_sources.sh "$VER" "$RAW_BASE" \
            "com.lath.fusionrecorder.sidestore.raw" "ci-logs/source.json"

      - name: 把日志与产物推到 ios-build 分支
        if: always()
        run: |
          set +e
          mkdir -p ci-logs
          LOG="$RUNNER_TEMP/build.log"

          if [ -f "$LOG" ]; then
            grep -E "error:|fatal error:|BUILD FAILED|The following build commands failed" "$LOG" \
              | grep -v "^ *$" | sort -u > ci-logs/errors.txt
          else
            echo "(没有生成构建日志)" > ci-logs/errors.txt
          fi

          {
            echo "# FusionRecorder iOS 最后一次构建"
            echo
            echo "- 结果: **${{ steps.build.outcome }}**"
            echo "- 提交: \`${{ github.sha }}\`"
            echo "- 时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "## 错误摘要"
            echo
            echo '```'
            cat ci-logs/errors.txt
            echo '```'
            echo
            echo "## 编译日志（末尾 2000 行）"
            echo
            echo '```'
            if [ -f "$LOG" ]; then tail -2000 "$LOG"; else echo "(无)"; fi
            echo '```'
          } > ci-logs/last-build.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ios-build
          git add -f ci-logs/
          git commit -m "ci: FusionRecorder 构建日志与产物 [skip ci]" || echo "内容无变化"
          git push -f origin ios-build

      - name: 编译失败则让 job 失败
        if: steps.build.outcome != 'success'
        run: |
          echo "编译失败。日志见 ios-build 分支 ci-logs/last-build.md"
          exit 1

# XcodeGen 工程描述 —— FusionRecorder iPhone 端
#
# 本机/云端沙箱都没有 Xcode，所以 .xcodeproj 不提交，用这份纯文本 YAML 在
# GitHub Actions 的 macOS runner 上生成（见 .github/workflows/build-ipa.yml）。
#
# 本地有 Mac：brew install xcodegen && xcodegen generate && open FusionRecorder.xcodeproj

name: FusionRecorder

options:
  bundleIdPrefix: com.lath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 版本号全局唯一来源：CI 读它决定 IPA 文件名与 SideStore 源版本
    # 0.1.1 = 界面按交接文件复刻（activity_main.xml / 融合成片预览）
    # 0.1.2 = 预览换成真实帧合成，且预览/录制共用唯一合成器与参数（WYSIWYG）
    # 0.2.0 = 双路 SEI pts 对齐 + AVAssetWriter 逐帧写 mp4 到相册
    # 0.3.0 = ADB 自动化骨架（发现/授权/sync push/命令状态机）+ 全自动监听接收
    # 0.3.4 = 修 AUTH 公钥 NUL / sync push remoteId / iPhone IP 选网卡 / SideStore 版本
    # 0.3.5 = 内嵌采集端支持连接重试，修首连 ECONNREFUSED 导致相机流 0 帧
    # 0.3.6 = 修 4 项真机问题：手动按钮卡封装 / 相机倒置180° / 成片时长缩水 / 0帧卡死
    # 0.3.7 = 重构成败关键：合成与写帧解耦(异步合成+恒定20fps写帧)，默认分辨率降640×480
    # 0.3.8 = 修 0.3.7 画面冻结：合成改独立20fps定时器+取两路最新帧；加2秒诊断日志
    # 0.3.9 = 修眼镜端相机流中途断线不自恢复（停推30+s）：sender自动重连补发SPS/PPS + wake lock
    # 0.4.0 = 离线录制架构：眼镜本地双路录 mp4 → ADB pull → iPhone 离线合成
    # 0.4.1 = 0.4.0 真机修复：WAKE_LOCK 权限 / 相机 mp4 落 App 私有目录 /
    #         绝对时间 meta 两行（首帧pts+结束时刻）修正两路对齐与 VFR 时长
    # 0.4.2 = 拉取链路修正：RECV 结束帧是 DONE 不是 OKAY（否则 pull 永远等不到完成）/
    #         Data 切片按 startIndex 取偏移（DENT 的 size 会读错）/ 拉取改空闲超时 /
    #         录制前把屏幕叫醒并保持常亮（屏幕路没帧就录不出东西）
    # 0.4.3 = 「点开始录制没反应」：复用部署那条已授权连接（第二条连接会卡在 AUTH/CNXN 之后）/
    #         push 后校验远端字节数 / pm install 失败判定补 Exception / 所有静默 return 都打日志
    # 0.4.4 = 根治「部署成功但没装上」：sync SEND 的 mode 必须是十进制 st_mode（33188），
    #         写八进制 "644" 会被 adbd 当成十进制 → 0o1204（--w----r-T）→ pm install 读不了
    # 0.4.5 = 修「拉相机 mp4 超时」：超时改统一空闲看门狗（数据在流就永不超时）/
    #         单路失败自动重试 3 次 / 字节数校验 / 进度条带 MB·速率·剩余秒数
    #         0.4.6 追加：失败后「重试传输并合成」按钮（本地已有文件就直接合成）
    #         0.4.7 = 修「传输完成却报失败」：等到 .meta 才算写完 + 拉前重新 stat，
    #                 字节校验只拦「收少了」，收多了（文件封口后又长）按实际算
    #         0.4.8 = 就绪检查改真轮询：0.6 秒一轮最多 18 轮（真机实测最坏 13.4 秒），
    #                 原来只采样一次，相机 drain EOS 慢过 0.5 秒就会立刻判「没写完」
    #         0.4.9 = 录制前删掉上一次的 mp4 和 .meta：上传失败时旧文件会留在眼镜上，
    #                 而 .meta 是「已封口」判据，旧文件会让就绪检查误判、拉回上一条片子
    #         0.5.0 = ① 录到声音：眼镜端 AAC 单声道音轨（独立 .m4a）+ iPhone 端
    #                   AVMutableComposition 按绝对 pts 并入成片，音量由「合成音量」滑杆控制；
    #                 ② 界面重排：预览置顶、三按钮（开始/相册/刷新预览）、连接信息栏，
    #                   提示语与调试参数日志默认收起；
    #                 ③ 刷新预览：screencap + APK SNAPSHOT 抓真实两帧再合成
    #         0.5.1 = 真机命令修正：快照改用 start-foreground-service（Android 9 拒绝
    #                 后台服务启动）；设备型号改用两行 echo（竖线被 shell 当管道吃掉）
    #         0.5.2 = 眼镜端音频时基修准：不再拿 startRecording() 当时钟起点（真机实测
    #                 麦克风要 3.5 秒才吐第一个采样，音轨会整体错位），改用
    #                 AudioRecord.getTimestamp(TIMEBASE_MONOTONIC) 反推第 0 帧真实时刻；
    #                 读循环改非阻塞轮询 + 尾部排空加硬上限（原来停止会卡 7 秒）
    #         0.5.3 = ① 没连上眼镜不再显示旧预览（FrameStore 启动不恢复旧帧/样例），
    #                  ADB 握手加 12s 提示 + 40s 超时，不再无限「正在连接」；
    #                 ② 眼镜名字只显示设备自报的 ro.product.model（ARGlasses），
    #                  不再写死「玄景」；本机 IP 只显示局域网私有地址，不同网段给警告；
    #                 ③ 刷新预览的相机快照补 180°（此前判断「JPEG 已是正的」是错的）；
    #                 ④ 界面按深色卡片风格重做（渐变底/卡片分层/状态胶囊/分组图标）
    MARKETING_VERSION: "0.5.3"
    CURRENT_PROJECT_VERSION: "24"
    # 侧载不需要 Apple 签名，签名交给 SideStore / AltStore 用免费 Apple ID 做
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

schemes:
  FusionRecorder:
    build:
      targets:
        FusionRecorder: all

targets:
  FusionRecorder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: FusionRecorder/App
      - path: FusionRecorder/UI
      - path: FusionRecorder/ADB
      - path: FusionRecorder/Stream
      - path: FusionRecorder/Pipeline
      - path: FusionRecorder/Session
      - path: FusionRecorder/Frame
      - path: FusionRecorder/Assets.xcassets
        buildPhase: resources
      - path: FusionRecorder/Resources
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lath.fusionrecorder
        PRODUCT_NAME: FusionRecorder
        INFOPLIST_FILE: FusionRecorder/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

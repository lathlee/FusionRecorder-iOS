# XcodeGen 工程描述 —— FusionRecorder iPhone 端
#
# 本机/云端沙箱都没有 Xcode，所以 .xcodeproj 不提交，用这份纯文本 YAML 在
# GitHub Actions 的 macOS runner 上生成（见 .github/workflows/build-ipa.yml）。
#
# 本地有 Mac：brew install xcodegen && xcodegen generate && open FusionRecorder.xcodeproj

name: FusionRecorder

options:
  bundleIdPrefix: com.lath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 版本号全局唯一来源：CI 读它决定 IPA 文件名与 SideStore 源版本
    # 0.1.1 = 界面按交接文件复刻（activity_main.xml / 融合成片预览）
    # 0.1.2 = 预览换成真实帧合成，且预览/录制共用唯一合成器与参数（WYSIWYG）
    # 0.2.0 = 双路 SEI pts 对齐 + AVAssetWriter 逐帧写 mp4 到相册
    # 0.3.0 = ADB 自动化骨架（发现/授权/sync push/命令状态机）+ 全自动监听接收
    # 0.3.4 = 修 AUTH 公钥 NUL / sync push remoteId / iPhone IP 选网卡 / SideStore 版本
    # 0.3.5 = 内嵌采集端支持连接重试，修首连 ECONNREFUSED 导致相机流 0 帧
    MARKETING_VERSION: "0.3.5"
    CURRENT_PROJECT_VERSION: "6"
    # 侧载不需要 Apple 签名，签名交给 SideStore / AltStore 用免费 Apple ID 做
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

schemes:
  FusionRecorder:
    build:
      targets:
        FusionRecorder: all

targets:
  FusionRecorder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: FusionRecorder/App
      - path: FusionRecorder/UI
      - path: FusionRecorder/ADB
      - path: FusionRecorder/Stream
      - path: FusionRecorder/Pipeline
      - path: FusionRecorder/Session
      - path: FusionRecorder/Frame
      - path: FusionRecorder/Assets.xcassets
        buildPhase: resources
      - path: FusionRecorder/Resources
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lath.fusionrecorder
        PRODUCT_NAME: FusionRecorder
        INFOPLIST_FILE: FusionRecorder/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
